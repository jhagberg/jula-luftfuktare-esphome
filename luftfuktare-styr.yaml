# Jula-luftfuktare: ESP8266 ersätter styrkortet och reglerar dimman steglöst mot SHT45.
# D1 -> PWM (direkt), D7 -> 470 ohm -> FAN, A0 <- KS (22k + 18k-delare),
# SHT45 på I2C (SDA D6, SCL D5). Ström: buck 24V -> 5V till VIN.
substitutions:
  shelly_ip: 192.168.1.50  # Shelly Plug S Gen3 för värmen; ge den fast IP

esphome:
  name: luftfuktare

esp8266:
  board: nodemcuv2
  restore_from_flash: true  # mål, läge och manuell nivå överlever strömavbrott

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# Värmen: Shelly Plug S Gen3. Varje puls skickas som "på, stäng själv efter X s",
# så värmen slocknar av sig själv om ESP:n, wifi eller givaren dör.
http_request:
  timeout: 3s
  verify_ssl: false  # bara http mot Shellyn

i2c:
  sda: D6
  scl: D5

output:
  - platform: esp8266_pwm
    id: mist_pwm
    pin: D1
    frequency: 81Hz  # uppmätt från originalkortet
  - platform: gpio
    id: fan_out
    pin: D7  # FAN är aktiv hög

globals:
  - id: integral
    type: float
    initial_value: "0"
  - id: duty_now
    type: float
    initial_value: "0"
  - id: heat_i
    type: float
    initial_value: "0.3"  # ungefär vad frostvakten behöver för att hålla 25 °C
  - id: heat_s
    type: float
    initial_value: "0"
  - id: tank_tom
    type: bool
    restore_value: true  # låst tills "Tank påfylld" trycks, även efter strömavbrott
    initial_value: "false"

script:
  # Sätt dimman (0 eller 25–80 %). Fläkten går ~30 s efter att dimman stängts av.
  - id: set_mist
    mode: queued
    parameters:
      d: float
    then:
      - lambda: |-
          if (id(tank_tom)) d = 0;
          else if (d > 0) d = clamp(d, 25.0f, 80.0f);
          id(duty_now) = d;
          id(mist_pwm).set_level(d / 100.0f);
          id(dimma_ut).publish_state(d);
          if (d > 0) {
            id(fan_afterrun).stop();
            id(fan_out).turn_on();
          } else {
            id(fan_afterrun).execute();
          }
  - id: fan_afterrun
    mode: restart
    then:
      - delay: 30s
      - output.turn_off: fan_out
  # Visar "Värme" medan pulsen pågår; Shellyn stänger själv när toggle_after går ut.
  - id: heat_pulse
    mode: restart
    then:
      - lambda: id(varme).publish_state(id(heat_s) > 0);
      - delay: !lambda return id(heat_s) * 1000;
      - lambda: id(varme).publish_state(false);

number:
  - platform: template
    id: target_rh
    name: "Mål luftfuktighet"
    unit_of_measurement: "%"
    min_value: 40
    max_value: 95
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 90
  - platform: template
    id: manuell
    name: "Manuell dimma"
    unit_of_measurement: "%"
    min_value: 0
    max_value: 80
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 0
    on_value:
      - if:
          condition:
            switch.is_off: auto_mode
          then:
            - script.execute:
                id: set_mist
                d: !lambda return x;
  - platform: template
    id: target_temp
    name: "Mål temperatur"
    unit_of_measurement: "°C"
    min_value: 15
    max_value: 30
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 25
  - platform: template
    id: kp
    name: "Kp"
    entity_category: config
    min_value: 0
    max_value: 50
    step: 0.5
    optimistic: true
    restore_value: true
    initial_value: 8      # % dimma per %RH fel
  - platform: template
    id: ki
    name: "Ki"
    entity_category: config
    min_value: 0
    max_value: 1
    step: 0.005
    optimistic: true
    restore_value: true
    initial_value: 0.02   # % dimma per %RH och sekund

switch:
  - platform: template
    id: heat_enable
    name: "Värmestyrning"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - lambda: id(heat_s) = 0;
      - script.execute: heat_pulse
      - http_request.get: http://${shelly_ip}/rpc/Switch.Set?id=0&on=false
  - platform: template
    id: auto_mode
    name: "Automatisk styrning"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - script.execute:
          id: set_mist
          d: !lambda return id(manuell).state;

# PI-regulator. Under ~20 % ger givaren knappt dimma, så den slår av där.
interval:
  - interval: 10s
    then:
      - lambda: |-
          if (!id(auto_mode).state) return;
          float rh = id(rh_sensor).state;
          if (isnan(rh) || id(tank_tom)) {
            id(integral) = 0;
            if (id(duty_now) != 0) id(set_mist)->execute(0);
            return;
          }
          float err = id(target_rh).state - rh;
          id(integral) = clamp(id(integral) + id(ki).state * err * 10.0f, 0.0f, 80.0f);
          float out = id(kp).state * err + id(integral);
          float d = out < 20.0f ? 0.0f : clamp(out, 25.0f, 80.0f);
          if (fabsf(d - id(duty_now)) >= 1.0f) id(set_mist)->execute(d);
  # Värme med pulsbredd: var 10:e minut räknar en PI-regulator ut hur länge värmen
  # ska gå, och Shellyn får "på, stäng själv efter X s". Frostvakten har några
  # minuters eftersläpning, så korta pulser ger mycket mindre översläng än av/på.
  - interval: 10min
    then:
      - lambda: |-
          const float window = 600;  // s, fönstrets längd
          const float max_duty = 0.8;  // 10 min full effekt från kallt gav 30 °C
          float t = id(temp_sensor).state;
          float duty = 0;
          if (!isnan(t) && id(heat_enable).state) {
            float err = id(target_temp).state - t;
            float i = clamp(id(heat_i) + 0.02f * err, 0.0f, 1.0f);
            if (0.1f * err + i < max_duty || err < 0) id(heat_i) = i;  // integrera inte upp mot taket
            duty = clamp(0.1f * err + id(heat_i), 0.0f, max_duty);
          }
          float s = duty * window;
          if (s < 30) s = 0;  // kortare pulser gör ingen nytta
          id(heat_s) = s;
          ESP_LOGI("varme", "T=%.2f puls %.0f s (I=%.2f)", t, s, id(heat_i));
      - script.execute: heat_pulse
      - if:
          condition:
            lambda: return id(heat_s) > 0;
          then:
            - http_request.get: !lambda |-
                return "http://${shelly_ip}/rpc/Switch.Set?id=0&on=true&toggle_after=" + to_string((int) id(heat_s));
          else:
            - http_request.get: http://${shelly_ip}/rpc/Switch.Set?id=0&on=false

sensor:
  - platform: sht4x
    update_interval: 10s
    temperature:
      id: temp_sensor
      name: "Temperatur"
      filters:
        - timeout: 60s
    humidity:
      id: rh_sensor
      name: "Luftfuktighet"
      filters:
        - timeout: 60s  # NaN om givaren tystnar, annars kör PI:n vidare på gammalt värde
  - platform: template
    id: dimma_ut
    name: "Dimma"
    unit_of_measurement: "%"
    accuracy_decimals: 0
  # KS: ~0 i vila, några volt när givaren går med vatten och överdel. Används bara som på/av.
  - platform: adc
    id: ks
    pin: A0
    name: "KS"
    update_interval: 100ms
    filters:
      - multiply: 7.33  # 22k i serie + 18k (D->C) parallellt med NodeMCU:ns 320k
      - sliding_window_moving_average:
          window_size: 5
          send_every: 2

binary_sensor:
  # KS går bara högt medan givaren kör, så tom tank märks först efter en kort provkörning.
  - platform: template
    id: torrkorning
    internal: true
    lambda: return id(duty_now) > 0 && id(ks).state < 1.0f;
    filters:
      - delayed_on: 3s
    on_press:
      - lambda: id(tank_tom) = true;
      - script.execute:
          id: set_mist
          d: 0
  - platform: template
    id: varme
    name: "Värme"
    device_class: heat
  - platform: template
    name: "Tank tom"
    device_class: problem
    lambda: return id(tank_tom);

button:
  - platform: template
    name: "Tank påfylld"
    on_press:
      - lambda: id(tank_tom) = false;
      - if:
          condition:
            switch.is_off: auto_mode
          then:
            - script.execute:
                id: set_mist
                d: !lambda return id(manuell).state;
